name: CI

# Builds and tests the platform-neutral OpenLeanPrint core (imposition engine).
# Runs on Linux since the core has no Windows dependencies.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore OpenLeanPrint.sln

      - name: Build
        run: dotnet build OpenLeanPrint.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenLeanPrint.sln --configuration Release --no-build
