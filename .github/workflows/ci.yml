name: CI

# Two jobs on purpose:
#   linux   - proves the portable half really is portable (it is what most
#             contributors will build) and runs the cross-platform tests.
#   windows - runs the Windows-only tests, which self-skip on Linux, and builds
#             the WPF app, which cannot build on Linux at all.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (portable core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore OpenLeanPrint.sln

      - name: Build
        run: dotnet build OpenLeanPrint.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenLeanPrint.sln --configuration Release --no-build

  windows:
    name: Windows (printing + app)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # The Windows solution adds the WPF app to everything the Linux job builds.
      - name: Build everything (incl. the WPF app)
        run: dotnet build OpenLeanPrint.Windows.sln --configuration Release

      # Same test suite as Linux, but here the GDI+/spooler tests actually run
      # instead of skipping.
      - name: Test
        run: dotnet test OpenLeanPrint.sln --configuration Release
