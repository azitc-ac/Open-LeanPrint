name: Release

# Builds the installers on GitHub's runners rather than on somebody's desk.
#
# Two reasons, and the second is the one that matters for the future:
#
#   1. A release built here comes from a commit anyone can check out, with a
#      toolchain anyone can read, instead of from whatever happened to be
#      installed on one machine. That has already cost this project an
#      afternoon once, when a locally built package turned out to be hours
#      older than the change it was supposed to carry.
#   2. SignPath Foundation - which is where the publicly trusted certificate is
#      meant to come from - will not sign an artifact somebody uploads. It signs
#      artifacts produced by a build system it trusts, fetched from the workflow
#      run that produced them. That is why the packages are uploaded as workflow
#      artifacts and not only attached to the release.
#
# The packages built here are deliberately NOT signed. That is the shape
# SignPath expects: the build produces an unsigned artifact, the signing request
# goes out from this workflow, and the signed package comes back. Until the
# certificate exists, releases are still signed locally with
# scripts/Build-Installer.ps1 -CertificateSubject "...".

on:
  push:
    tags: ['v*']
  # So the whole thing can be exercised without cutting a release.
  workflow_dispatch:


jobs:
  build:
    name: ${{ matrix.runtime }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-arm64, win-x64]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # A release that ships failing code is worse than a late release. The
      # runner is x64, so the arm64 package is cross-built - which is fine for
      # packaging but means the tests run against the runner's own runtime.
      - name: Test
        if: matrix.runtime == 'win-x64'
        run: dotnet test OpenLeanPrint.sln --configuration Release

      - name: Build the installer
        run: ./scripts/Build-Installer.ps1 -Runtime ${{ matrix.runtime }}
        shell: pwsh

      - name: Name it after the version it carries
        id: package
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $source = "dist/Open-LeanPrint-${{ matrix.runtime }}.msi"
          $named = "dist/Open-LeanPrint-$version-${{ matrix.runtime }}.msi"
          Move-Item $source $named -Force
          "version=$version" >> $env:GITHUB_OUTPUT
          "path=$named" >> $env:GITHUB_OUTPUT
          Write-Host "  $named  ($([math]::Round((Get-Item $named).Length / 1MB, 1)) MB)"

      # SignPath reads its input from here. Keep the name stable: a signing
      # request names the artifact it wants.
      #
      # This step warns that it targets Node 20. v5 is the current release and
      # warns just the same - it is GitHub's own action lagging behind their
      # runner, and the run is forced onto Node 24 regardless. Nothing to fix
      # here; do not go chasing it again.
      - name: Upload the package
        uses: actions/upload-artifact@v5
        with:
          name: installer-${{ matrix.runtime }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Once SignPath Foundation has approved the project, the signing step
      # goes here, between building and publishing:
      #
      #   - uses: signpath/github-action-submit-signing-request@v1
      #
      # It takes the artifact uploaded above, submits a signing request, waits
      # for the approval, and writes the signed package back. Nothing else in
      # this workflow has to change - which is the point of building unsigned.
      # ---------------------------------------------------------------------

# Nothing is attached to the release yet, and that is deliberate.
#
# There used to be a job here that uploaded these packages to the release the
# tag belongs to. The first time it ran on a real tag it did exactly what it was
# told: it replaced the locally signed packages with these unsigned ones, and the
# release briefly offered downloads that Windows would refuse to vouch for.
#
# Unsigned is right for the build and wrong for the release, and until SignPath
# closes that gap the two cannot be the same file. So releases are still built
# and signed locally with scripts/Build-Installer.ps1 and attached by hand, and
# what this workflow produces is the artifacts above - which is what SignPath
# will read from.
#
# When the certificate arrives, both halves come back together: the signing step
# in the build job, and an attach job downstream of it.